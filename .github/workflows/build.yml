name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Optional repo secrets. Without the signing ones, a debug-signed APK is published instead
      # (the release build still runs, unsigned, to verify R8/ProGuard).
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      API_DISPLAY_NAME: ${{ secrets.API_DISPLAY_NAME }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_AUTH_URL: ${{ secrets.API_AUTH_URL }}
      API_TOKEN_URL: ${{ secrets.API_TOKEN_URL }}
      API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
      API_SCOPES: ${{ secrets.API_SCOPES }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "api.displayName=$API_DISPLAY_NAME"
            echo "api.baseUrl=$API_BASE_URL"
            echo "api.authUrl=$API_AUTH_URL"
            echo "api.tokenUrl=$API_TOKEN_URL"
            echo "api.clientId=$API_CLIENT_ID"
            echo "api.scopes=$API_SCOPES"
          } > local.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "release.storeFile=$RUNNER_TEMP/release.jks"
              echo "release.storePassword=$KEYSTORE_PASSWORD"
              echo "release.keyAlias=$KEY_ALIAS"
              echo "release.keyPassword=$KEY_PASSWORD"
            } >> local.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::notice::No signing secrets set. Publishing a debug-signed APK; release build runs unsigned to verify R8."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK (R8 + lintVital)
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.SIGNED == 'true' && 'app-release' || 'app-debug' }}
          path: ${{ env.SIGNED == 'true' && 'app/build/outputs/apk/release/*.apk' || 'app/build/outputs/apk/debug/*.apk' }}
          if-no-files-found: error
          retention-days: 14

      - name: Lint
        if: always()
        run: ./gradlew --no-daemon lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/
          if-no-files-found: ignore
          retention-days: 14

  smoke-test:
    # Boots an emulator, installs the debug build and runs the instrumented smoke test
    # (launch, PIN gate, every screen, panic gesture).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew --no-daemon connectedDebugAndroidTest || (adb logcat -d -s PFHEALTH:I; exit 1); adb logcat -d -s PFHEALTH:I

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
