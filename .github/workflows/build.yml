name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional repo secrets. Without the signing ones, a debug-signed APK is produced instead.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      API_DISPLAY_NAME: ${{ secrets.API_DISPLAY_NAME }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_AUTH_URL: ${{ secrets.API_AUTH_URL }}
      API_TOKEN_URL: ${{ secrets.API_TOKEN_URL }}
      API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
      API_SCOPES: ${{ secrets.API_SCOPES }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "api.displayName=$API_DISPLAY_NAME"
            echo "api.baseUrl=$API_BASE_URL"
            echo "api.authUrl=$API_AUTH_URL"
            echo "api.tokenUrl=$API_TOKEN_URL"
            echo "api.clientId=$API_CLIENT_ID"
            echo "api.scopes=$API_SCOPES"
          } > local.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "release.storeFile=$RUNNER_TEMP/release.jks"
              echo "release.storePassword=$KEYSTORE_PASSWORD"
              echo "release.keyAlias=$KEY_ALIAS"
              echo "release.keyPassword=$KEY_PASSWORD"
            } >> local.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set. Building a debug-signed APK instead of a release APK."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        if: env.SIGNED == 'true'
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK (no signing secrets)
        if: env.SIGNED != 'true'
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGNED == 'true' && 'app-release' || 'app-debug' }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Lint
        if: always()
        run: ./gradlew --no-daemon lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
