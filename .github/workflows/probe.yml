name: probe
# Manual: fetch real pages from candidate sites, so their parsers are written against what they serve.
on:
  workflow_dispatch:
    inputs:
      sites:
        description: "JSON: {name: {lists: [urls], video: regex}}"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          SITES_JSON: ${{ github.event.inputs.sites }}
        run: python3 .github/probe/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe-out
